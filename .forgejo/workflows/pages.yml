# Codeberg Terms of Use § 2 (1) 7 forbid sharing projects that mostly consist of
# code written by generative-AI tools:
# https://codeberg.org/Codeberg/org/src/branch/main/TermsOfUse.md
# This workflow is not for codeberg.org. It can still be built on a self-hosted
# Forgejo instance or runner.
#
# Build static site to dist/ and publish via git-pages (e.g. Codeberg Pages).
# Trigger: push any git tag (see `on:` below). Not on branch pushes.
# Codeberg hosted runners (e.g. codeberg-*) use ghcr.io/catthehacker/ubuntu:act-latest — use apt, not apk.
# Self-hosted runners with the default "docker" label often use Alpine; adjust install commands to match the job image.
# For Pages not on codeberg.page, set repository variable PAGES_SITE to the site base URL (with trailing slash).

name: Pages

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: codeberg-tiny
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Python and build
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/staticvita

      - name: Deploy to Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ vars.PAGES_SITE || format('https://{0}.codeberg.page/{1}/', forge.repository_owner, forge.event.repository.name) }}
          token: ${{ forge.token }}
          source: dist/
