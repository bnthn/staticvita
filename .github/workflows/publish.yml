# Build an sdist and wheel on a GitHub Release and upload them to PyPI
# with trusted publishing. Pre-releases are built but not uploaded.
# No API token: the publish job's OIDC token is exchanged by PyPI.

name: Publish

on:
  release:
    types:
      - published

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject version ${version}."
            echo "Tag the release v${version} (a leading v is optional)."
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build --outdir python-dist

      - name: Check package metadata
        run: twine check python-dist/*

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/whl
          /tmp/whl/bin/pip install python-dist/*.whl
          /tmp/whl/bin/staticvita --version

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python-dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.repository == 'bnthn/staticvita' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/staticvita
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: python-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist
